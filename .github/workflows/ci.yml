name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that's already going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails if package-lock.json is out of sync with package.json.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Also type checks the whole app.
      - run: npm run build
